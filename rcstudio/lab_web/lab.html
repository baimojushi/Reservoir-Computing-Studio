<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>储备池实验室</title>
<style>
:root{
  color-scheme: light;
  --paper:#ECEFEC; --surface:#F8F9F7; --ink:#17202A; --ink2:#4E5A66; --ink3:#87919A; --rule:#D0D6D3;
  --pond0:#182433; --pond1:#0A1017; --pond-rim:#33465A; --pond-ink:#DDE7EF; --pond-dim:#34455A;
  --pos:#1D61AE; --neg:#C5371E; --in:#9A6700; --out:#0E7A5E;
  --pos-g:#73BBFF; --neg-g:#FF7654; --in-g:#FFC84A; --out-g:#45D9AC;
  --btn:#17202A; --btn-ink:#F8F9F7; --focus:#1D61AE;
  --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC","Hiragino Sans GB","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0D1216; --surface:#151C22; --ink:#E8EDF0; --ink2:#A7B2BC; --ink3:#6E7B86; --rule:#26313A;
    --pond0:#131D29; --pond1:#06090D; --pond-rim:#3A4E64;
    --pos:#73BBFF; --neg:#FF7654; --in:#FFC84A; --out:#45D9AC;
    --btn:#E8EDF0; --btn-ink:#0D1216; --focus:#73BBFF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0D1216; --surface:#151C22; --ink:#E8EDF0; --ink2:#A7B2BC; --ink3:#6E7B86; --rule:#26313A;
  --pond0:#131D29; --pond1:#06090D; --pond-rim:#3A4E64;
  --pos:#73BBFF; --neg:#FF7654; --in:#FFC84A; --out:#45D9AC;
  --btn:#E8EDF0; --btn-ink:#0D1216; --focus:#73BBFF;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--paper); color:var(--ink); font:14px/1.7 var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}

.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr)}

/* chapter rail: a real sequence, so it is numbered */
.rail{display:flex; align-items:stretch; gap:2px; padding:0 14px 0 18px; border-bottom:1px solid var(--rule); min-height:46px}
.chap{display:flex; align-items:center; gap:8px; padding:0 14px 0 10px; border:0; background:none; color:var(--ink3);
  position:relative; white-space:nowrap; font-size:13.5px}
.chap .num{width:20px; height:20px; border-radius:50%; border:1.5px solid currentColor; display:grid; place-items:center;
  font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1}
.chap.done .num{background:var(--ink3); border-color:var(--ink3); color:var(--paper)}
.chap[aria-current="step"]{color:var(--ink); font-weight:600}
.chap[aria-current="step"] .num{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chap[aria-current="step"]::after{content:""; position:absolute; left:10px; right:14px; bottom:-1px; height:2px; background:var(--ink)}
.chap:hover{color:var(--ink)}
.chap.run{margin-left:10px; padding-left:16px}
.chap.run::before{content:""; position:absolute; left:0; top:13px; bottom:13px; width:1px; background:var(--rule)}
.chap.run .num{border-radius:5px; width:auto; padding:0 5px; height:18px}
.rail .gap{flex:1}
.chap,.tool{flex:none; white-space:nowrap}
.tool{align-self:center; border:1px solid var(--rule); background:none; border-radius:999px; padding:3px 12px; font-size:12.5px; color:var(--ink2); margin-left:6px}
.tool[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.tool.next{color:var(--ink); font-weight:600; padding:4px 14px; margin-right:10px}
.tool.next.ready{background:var(--out); border-color:var(--out); color:#fff}

.main{display:grid; grid-template-columns:minmax(300px,392px) minmax(0,1fr); min-height:0}
.story{display:flex; flex-direction:column; min-height:0; padding:0; border-right:1px solid var(--rule)}
.inst{display:grid; grid-template-rows:minmax(0,1fr) auto; min-width:0; min-height:0}
.story .body{flex:1; min-height:0; overflow-y:auto; padding:20px 22px 8px 24px}
.story h1{font:700 25px/1.3 var(--serif); margin:0 0 10px; letter-spacing:.01em}
.story p{margin:0 0 10px; max-width:34em}
.story .lead{color:var(--ink2)}
.story strong{font-weight:650}
.acts{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin:12px 0 12px}
.btn{border:1px solid var(--btn); background:var(--btn); color:var(--btn-ink); border-radius:8px; padding:7px 18px; font-weight:600; font-size:14px}
.btn.ghost{background:none; color:var(--ink); border-color:var(--rule); font-weight:500; padding:6px 13px; font-size:13px}
.btn:disabled{opacity:.45; cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.hint{color:var(--ink3); font-size:12.5px}
.obs{border-top:1px solid var(--rule); padding-top:12px; margin-top:4px}
.obs p:last-child{margin-bottom:4px}
.obs.top{margin-bottom:10px}
.obs .empty{color:var(--ink3)}
.echo{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:end; margin:0 0 10px}
.echo #head:empty{display:none}
.big{font-size:13px; color:var(--ink2); margin:0 !important; display:flex; flex-direction:column; gap:2px; line-height:1.3}
.big .n{white-space:nowrap}
.big b{font:700 34px/1.05 var(--sans); color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.big .was{font-size:12px; color:var(--ink3)}
.big.wide{margin:0 0 8px !important}
.mini{display:block; width:100%; height:64px}
.sci{display:none; font-size:12.5px; line-height:1.65; color:var(--ink2); border-left:2px solid var(--rule); padding:2px 0 2px 12px; margin:12px 0 4px}
.show-sci .sci{display:block}
.sci code{font:inherit; font-variant-numeric:tabular-nums; color:var(--ink)}
.nav{display:none}
.nav .btn.next{margin-left:auto}
.nav .btn.next.ready{background:var(--out); border-color:var(--out); color:#fff}
:root[data-theme="dark"] .next.ready{color:#06231A !important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .next.ready{color:#06231A !important}}

.knob{margin:0 0 8px}
.knob .row{display:flex; align-items:baseline; gap:8px}
.knob .name{font-weight:600}
.knob .tech{color:var(--ink3); font-size:12px}
.knob .val{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600}
.knob .slide{display:grid; grid-template-columns:4.6em minmax(0,1fr) 4.6em; align-items:center; gap:8px; color:var(--ink3); font-size:11.5px}
.knob .slide span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:22px; background:none; margin:0; display:block}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--ink); border:3px solid var(--paper); margin-top:-7px; box-shadow:0 0 0 1px var(--ink)}
input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:var(--rule)}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--ink); border:3px solid var(--paper); box-shadow:0 0 0 1px var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
.chips .lbl{color:var(--ink3); font-size:12.5px; align-self:center; margin-right:2px; min-width:3.2em}
.chip{border:1px solid var(--rule); background:none; border-radius:999px; padding:2px 12px; font-size:13px; color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.facts{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; margin:0 0 12px; font-size:13px}
.facts dt{color:var(--ink3)} .facts dd{margin:0; font-variant-numeric:tabular-nums}

.stage{position:relative; min-height:200px; min-width:0}
#pond{position:absolute; inset:0; width:100%; height:100%; touch-action:manipulation}
.legend{position:absolute; left:10px; bottom:8px; display:flex; gap:12px; font-size:12px; color:var(--ink3); pointer-events:none}
.legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px}
.nodechip{position:absolute; right:12px; bottom:8px; font-size:12.5px; color:var(--ink2); background:var(--surface); border:1px solid var(--rule);
  border-radius:999px; padding:2px 6px 2px 12px; display:none; align-items:center; gap:8px; font-variant-numeric:tabular-nums}
.nodechip.on{display:flex}
.nodechip button{border:0; background:none; color:var(--ink3); font-size:15px; line-height:1; padding:2px 5px}
#pond:focus-visible{outline-offset:-4px; border-radius:10px}
.stage-act{display:none; position:absolute; right:12px; bottom:34px; box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sum{display:flex; flex-wrap:wrap; gap:1px 12px; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink2); margin:0 0 10px}
.sum .s{white-space:nowrap}
.sum .s i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px}
.sum .eq{color:var(--ink); font-weight:600}
.toast{position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:12.5px;
  padding:4px 14px; border-radius:999px; display:none; max-width:92%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.toast.on{display:block}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--paper); font-size:12px; padding:2px 8px; border-radius:5px;
  transform:translate(-50%,-150%); white-space:nowrap; display:none; font-variant-numeric:tabular-nums}

.time{border-top:1px solid var(--rule); padding:10px 16px 8px 14px}
#tracks{display:block; width:100%; touch-action:none; border-radius:4px}
.transport{display:flex; align-items:center; gap:12px; margin-top:6px; padding-left:52px; font-size:12.5px; color:var(--ink2); flex-wrap:wrap}
.play{width:34px; height:34px; border-radius:50%; border:0; background:var(--ink); display:grid; place-items:center; padding:0; flex:none}
.play svg{width:14px; height:14px; fill:var(--paper)}
.clock{font-variant-numeric:tabular-nums; min-width:9.5em}
.seg{display:flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden}
.seg button{border:0; background:none; padding:2px 11px; font-size:12.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.transport .keys{margin-left:auto; color:var(--ink3); white-space:nowrap}
@media (max-width: 1080px){.transport .keys{display:none}}

@media (max-width: 780px){
  body{overflow:auto; height:auto}
  .app{height:auto; display:block}
  .rail{overflow-x:auto; padding:0 8px}
  .chap{padding:0 10px 0 6px}
  .main{display:flex; flex-direction:column}
  .inst{display:block; order:-1}
  .stage{height:min(86vw,360px)}
  .stage-act:not([hidden]){display:block}
  .story{border-right:0; border-top:1px solid var(--rule)}
  .story .body{overflow:visible; padding:16px 18px 8px}
  .nav{display:flex; gap:8px; align-items:center; padding:4px 18px 14px}
  .rail .next{display:none}
  .transport{padding-left:0}
  .transport .keys{display:none}
}
@media (max-height: 620px) and (min-width: 781px){
  .story .body{padding-top:14px}
  .story h1{font-size:22px; margin-bottom:6px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="rail" id="rail" role="navigation" aria-label="章节"></header>
  <main class="main">
    <section class="story" id="story" aria-live="polite"></section>
    <div class="inst">
    <section class="stage" id="stage">
      <canvas id="pond" tabindex="0" role="application" aria-label="储备池。方向键在节点之间移动，Esc 取消选中。"></canvas>
      <button type="button" class="btn stage-act" id="stageAct" hidden></button>
      <div class="legend" id="legend"></div>
      <div class="nodechip" id="nodechip"><span id="nodechipText" aria-live="polite"></span><button type="button" id="nodechipClose" aria-label="取消选中节点">×</button></div>
      <div class="tip" id="tip"></div>
      <div class="toast" id="toast" role="status"></div>
    </section>
    <section class="time">
    <canvas id="tracks" tabindex="0" role="slider" aria-label="时间轴，左右方向键逐步移动，空格播放或暂停"></canvas>
    <div class="transport">
      <button class="play" id="play" type="button" aria-label="暂停"></button>
      <span class="clock" id="clock"></span>
      <div class="seg" id="speed" role="group" aria-label="播放速度"></div>
      <div class="seg" id="segments" role="group" aria-label="实验数据段" hidden></div>
      <span class="keys">← → 逐步　空格 播放/暂停</span>
    </div>
    </section>
    </div>
  </main>
</div>
<script>
/*ENGINE-BEGIN*/
/* RC Studio lab engine: pure numerics, no DOM. Same leaky-tanh update as rcstudio.core / intuitive_lab.run_states. */
const RCEngine = (() => {
  "use strict";
  const PREROLL = 160;     // silent steps before t = 0 so the pool starts from where it rests
  const PULSE_WIDTH = 3;   // a poke lasts three steps so it is visible on the input track
  const PULSE_AMP = 1.0;

  function makeNet(d) {
    const n = d.n, inIdx = [], inW = [], outIdx = [];
    for (let i = 0; i < n; i++) { inIdx.push([]); inW.push([]); outIdx.push([]); }
    for (let k = 0; k < d.src.length; k++) {
      inIdx[d.dst[k]].push(d.src[k]); inW[d.dst[k]].push(d.w[k]); outIdx[d.src[k]].push(d.dst[k]);
    }
    return { n, seed: d.seed, src: d.src, dst: d.dst, w: d.w, win: d.win, bias: d.bias, pos: d.pos,
             inIdx, inW, outIdx };
  }

  /* x(t) = (1-a) x(t-1) + a tanh(rho W x(t-1) + gain W_in u(t) + b) */
  function step(net, p, x, u, out) {
    const n = net.n, a = p.leak, rho = p.rho, g = p.gain;
    for (let i = 0; i < n; i++) {
      let s = net.bias[i] + g * net.win[i] * u;
      const idx = net.inIdx[i], w = net.inW[i];
      for (let k = 0; k < idx.length; k++) s += rho * w[k] * x[idx[k]];
      out[i] = (1 - a) * x[i] + a * Math.tanh(s);
    }
  }

  function run(net, p, u, opts) {
    const n = net.n, T = u.length, X = new Float64Array(T * n);
    let x = new Float64Array(n), y = new Float64Array(n);
    if (opts && opts.initial) x.set(opts.initial);
    const pre = opts && opts.preroll != null ? opts.preroll : PREROLL;
    for (let k = 0; k < pre; k++) { step(net, p, x, 0, y); const t = x; x = y; y = t; }
    for (let t = 0; t < T; t++) {
      step(net, p, x, u[t], y);
      X.set(y, t * n);
      const tmp = x; x = y; y = tmp;
    }
    return X;
  }

  function signal(kind, T, drawn) {
    const u = new Float64Array(T);
    for (let t = 0; t < T; t++) {
      const ph = t / (T - 1);
      if (kind === "wave") u[t] = 0.58 * Math.sin(2 * Math.PI * ph * 4.2) + 0.22 * Math.sin(2 * Math.PI * ph * 11.3 + 0.55);
      else if (kind === "chirp") u[t] = 0.7 * Math.sin(2 * Math.PI * (1.6 * ph + 5.2 * ph * ph));
      else if (kind === "step") u[t] = [-0.5, 0.45, 0, 0.7, -0.3][Math.floor(t / 26) % 5];
      else if (kind === "draw" && drawn && drawn.length === T) u[t] = drawn[t];
      else u[t] = 0;
    }
    return u;
  }

  function withPokes(base, pokes) {
    const u = Float64Array.from(base);
    for (const t0 of pokes) for (let k = 0; k < PULSE_WIDTH; k++) {
      const t = t0 + k; if (t >= 0 && t < u.length) u[t] = Math.max(-1, Math.min(1, u[t] + PULSE_AMP));
    }
    return u;
  }

  /* What a finite observation of an echo curve does and does not show (mirrors core.classify_echo).
     decayed: fell below threshold x peak and stayed there for a margin of the window;
     window_too_short: still above the threshold at the end, but shrinking;
     no_decay_seen: still above the threshold and not shrinking within this window. */
  function classifyEcho(d, t0, threshold) {
    threshold = threshold == null ? 0.05 : threshold;
    const window = d.length - t0;
    let peak = 0;
    for (let k = t0; k < d.length; k++) if (d[k] > peak) peak = d[k];
    const out = { status: "silent", length: 0, window, threshold, peak, trend: null };
    if (window < 8 || peak < 1e-12) return out;
    let last = -1;
    for (let k = d.length - 1; k >= t0; k--) if (d[k] > threshold * peak) { last = k - t0; break; }
    if (last < window - Math.max(3, Math.floor(window / 20))) { out.status = "decayed"; out.length = last + 1; return out; }
    const q = Math.max(2, Math.floor(window / 4));
    let early = 0, late = 0;
    for (let k = 0; k < q; k++) { late += d[d.length - 1 - k]; early += d[d.length - 1 - q - k]; }
    out.trend = early > 1e-15 ? late / early : 1;
    out.status = out.trend < 0.8 ? "window_too_short" : "no_decay_seen";
    out.length = null;
    return out;
  }
  function describeEcho(d, t0) {
    const c = classifyEcho(d, t0);
    return { d, peak: c.peak, t0, status: c.status, window: c.window, trend: c.trend,
             len: c.length == null ? c.window : c.length, settled: c.status === "decayed" || c.status === "silent" };
  }

  /* Echo of one poke: RMS state difference between the run with and without it. */
  function echo(XA, XB, T, n, t0) {
    const d = new Float64Array(T);
    for (let t = 0; t < T; t++) {
      let s = 0;
      for (let i = 0; i < n; i++) { const v = XA[t * n + i] - XB[t * n + i]; s += v * v; }
      d[t] = Math.sqrt(s / n);
    }
    return describeEcho(d, t0);
  }

  function echoOfImpulse(states, steps, n) {
    const d = new Float64Array(steps);
    for (let t = 0; t < steps; t++) {
      let s = 0;
      for (let i = 0; i < n; i++) { const v = states[t * n + i]; s += v * v; }
      d[t] = Math.sqrt(s / n);
    }
    return describeEcho(d, 0);
  }

  /* Signed pieces of a linear readout at every step: y^ = bias + direct + sum_i w_i x_i.
     `direct` may be null when the saved trace lacks the model inputs; it is then inferred
     as "prediction minus everything else" where a prediction exists. */
  function readoutParts(X, T, n, nodes, bias, direct, predicted) {
    const P = new Float64Array(T), N = new Float64Array(T), Dr = new Float64Array(T), net = new Float64Array(T);
    let ext = 1e-9, residual = 0;
    for (let t = 0; t < T; t++) {
      let p = 0, q = 0;
      for (let i = 0; i < n; i++) { const v = nodes[i] * X[t * n + i]; if (v >= 0) p += v; else q += v; }
      const known = predicted && isFinite(predicted[t]);
      const d = direct ? direct[t] : (known ? predicted[t] - bias - p - q : NaN);
      P[t] = p; N[t] = q; Dr[t] = d; net[t] = p + q + bias + d;
      if (isFinite(d)) {
        ext = Math.max(ext, p + Math.max(d, 0) + Math.max(bias, 0), -(q + Math.min(d, 0) + Math.min(bias, 0)));
        if (direct && known) residual = Math.max(residual, Math.abs(net[t] - predicted[t]));
      } else ext = Math.max(ext, p, -q);
    }
    return { P, N, Dr, bias, net, ext, residual, inferred: !direct };
  }

  function solve(A, b, m) {           // Gaussian elimination with partial pivoting, A is m*m row-major
    A = Float64Array.from(A); b = Float64Array.from(b);
    for (let c = 0; c < m; c++) {
      let piv = c, best = Math.abs(A[c * m + c]);
      for (let r = c + 1; r < m; r++) { const v = Math.abs(A[r * m + c]); if (v > best) { best = v; piv = r; } }
      if (best < 1e-14) continue;
      if (piv !== c) {
        for (let k = c; k < m; k++) { const t = A[c * m + k]; A[c * m + k] = A[piv * m + k]; A[piv * m + k] = t; }
        const t = b[c]; b[c] = b[piv]; b[piv] = t;
      }
      for (let r = c + 1; r < m; r++) {
        const f = A[r * m + c] / A[c * m + c];
        if (f === 0) continue;
        for (let k = c; k < m; k++) A[r * m + k] -= f * A[c * m + k];
        b[r] -= f * b[c];
      }
    }
    const x = new Float64Array(m);
    for (let r = m - 1; r >= 0; r--) {
      let s = b[r];
      for (let k = r + 1; k < m; k++) s -= A[r * m + k] * x[k];

  netIndex: 0, net: E.makeNet(NETS[0]), p: { ...DEFAULTS },
  inputKind: "poke", freeInput: "wave", pokes: [], drawn: null,
  trained: false, trainedCh3: false,
  sel: -1, hover: -1, selSeen: new Set(), rewired: false,
  playing: !reduceMotion, pos: 0, speed: 1,
  show: { inLines: true, edges: false, readLines: true }, freeMode: "raster",
  sci: false, ghost: null, run: null, embedded: false, hostSeq: 0, fx: null,
};
let D = null;                 // data currently on screen (sandbox or real run)
let C = {};                   // colours read from CSS variables
let dirty = true, staticDirty = true;

/* ---------- colours ---------- */
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  for (const n of ["paper", "surface", "ink", "ink2", "ink3", "rule", "pond0", "pond1", "pond-rim", "pond-ink",
                   "pond-dim", "pos", "neg", "in", "out", "pos-g", "neg-g", "in-g", "out-g"]) C[n] = g("--" + n);
  C.rgb = {}; for (const n of ["pond0", "pond1", "pos-g", "neg-g", "pond-dim"]) C.rgb[n] = hex(C[n]);
  C.font = cs.getPropertyValue("--sans").trim();
}
function hex(h) { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgb(c, a) { return a == null ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
const glow = v => Math.pow(Math.min(1, Math.abs(v) / 0.8), 0.7);   // display curve only; |x| >= 0.8 is full brightness

/* ---------- data ---------- */
function isRun() { return S.chapter === RUN && S.run; }
function chapterDef() { return CH[S.chapter] || {}; }
function tracksShown() {
  if (isRun()) return ["in", "state", "out"];
  const c = chapterDef();
  if (c.tracks) return c.tracks;
  return S.inputKind === "poke" ? ["in", "state"] : ["in", "state", "out"];
}
function stateMode() { return isRun() || S.chapter === 4 ? S.freeMode : chapterDef().mode; }

function compute() {
  if (isRun()) { D = S.run; dirty = staticDirty = true; return; }
  const net = S.net, p = S.p, n = net.n, T = S.inputKind === "poke" ? TP : TW;
  const base = E.signal(S.inputKind, T, S.drawn);
  const pokes = S.inputKind === "poke" ? S.pokes : [];
  const u = E.withPokes(base, pokes);
  const longer = v => { const o = new Float64Array(v.length + LONG); o.set(v); return o; };
  const XL = E.run(net, p, longer(u)), X = XL.subarray(0, T * n);
  let echo = null;
  if (S.inputKind === "poke") {
    if (pokes.length) echo = E.echo(XL, E.run(net, p, longer(E.withPokes(base, pokes.slice(0, -1)))), T + LONG, n, pokes[pokes.length - 1]);
  } else {
    echo = E.echo(E.run(net, p, longer(E.withPokes(u, [80]))), XL, T + LONG, n, 80);   // unseen test poke on top of the signal
  }
  let fit = null, outTruth = null, outPred = null, parts = null;
  if (S.inputKind !== "poke") {
    outTruth = u;
    if (S.trained) {
      fit = E.fitReadout(X, u, T, n, { horizon: H, washout: WASH, trainEnd: TRAIN_END, ridge: 1e-4 });
      outPred = new Float64Array(T).fill(NaN);
      for (let t = WASH; t < T - H; t++) outPred[t + H] = fit.pred[t];
      fit.nodes = fit.w.subarray(2);
      parts = E.readoutParts(X, T, n, fit.nodes, fit.w[0], u.map(v => fit.w[1] * v), fit.pred);
    }
  }
  let amp = 0.3; for (let k = 0; k < X.length; k++) { const v = Math.abs(X[k]); if (v > amp) amp = v; }
  D = { kind: "sandbox", T, n, X, u, pos: net.pos, src: net.src, dst: net.dst, w: net.w, inIdx: net.inIdx, outIdx: net.outIdx,
        win: net.win, gain: p.gain, rho: p.rho, uModel: u, echo, fit, parts, outTruth, outPred, horizon: H, washEnd: WASH + H,
        sat: E.saturation(X, T, n), tStart: 0, amp };
  dirty = staticDirty = true;
}

const buildRun = payload => E.prepareRun(payload);   // numerics live in the engine block so Node can test them

/* ---------- actions ---------- */
function host(type, data) {
  if (!S.embedded) return;
  document.title = "rclab:" + JSON.stringify({ n: ++S.hostSeq, type, ...(data || {}) });
}
function markDone(i, detail) { if (!S.done[i]) { S.done[i] = true; renderRail(); host("progress", { chapter: CH[i].key, detail: detail || "" }); } updateNav(); }
function fxStart(kind) { S.fx = reduceMotion ? null : { kind, t0: performance.now() }; dirty = true; }
function fxProgress(kind, ms) {            // 0..1 while a user-triggered transition runs, 1 otherwise
  if (!S.fx || S.fx.kind !== kind) return 1;
  const p = (performance.now() - S.fx.t0) / ms;
  if (p >= 1) { S.fx = null; return 1; }
  dirty = true; return Math.max(0, p);
}
const echoWords = e => (e.status === "decayed" || e.status === "silent" ? `余波约 ${e.len} 步后平息`
  : e.status === "window_too_short" ? `观察 ${e.window} 步，余波仍在减弱但未平息` : `观察 ${e.window} 步，未见衰减`);

function goto(i) {
  if (i === RUN && !S.run) return;
  S.chapter = i; S.ghost = null;
  if (i !== RUN) {
    const c = CH[i];
    S.inputKind = c.input || S.freeInput;
    if (c.key === "readout") S.trained = S.trainedCh3;
    if (c.key === "free") S.trained = S.inputKind !== "poke";
    if ((c.key === "nodes" || c.key === "knobs") && !S.pokes.length) S.pokes = [12];
    S.show = { inLines: true, edges: false, readLines: true };
  } else S.show = { inLines: true, edges: false, readLines: true };
  S.sel = -1; S.hover = -1;
  if (i === RUN) $("toast").classList.remove("on");
  compute();
  S.pos = S.inputKind === "poke" && S.pokes.length && i !== RUN ? Math.max(0, S.pokes[S.pokes.length - 1] - 5) : 0;
  if (!reduceMotion) S.playing = true;
  renderRail(); renderStory(); layoutTracks(); renderTransport(); renderSegments(); updateChip();
}

function poke(t0) {
  if (isRun() || S.inputKind !== "poke") return;
  if (t0 == null) t0 = S.playing ? Math.floor(S.pos) + 2 : Math.round(S.pos);
  if (t0 > TP - 40) { S.pokes = []; t0 = 10; }          // too close to the end to watch an echo: start a fresh take
  t0 = Math.max(2, t0);
  S.pokes = S.pokes.filter(q => Math.abs(q - t0) > 3).concat([t0]).slice(-4);
  compute();
  S.pos = Math.max(0, t0 - 4); S.playing = true;
  fxStart("poke");
  updateObs(); renderTransport(); markDone(0, D.echo ? echoWords(D.echo) : "");
}
const knobWords = () => `回声长短 ${fmt(S.p.rho)}、反应快慢 ${fmt(S.p.leak)}、输入力度 ${fmt(S.p.gain)}：` + (D.echo ? echoWords(D.echo) : "");
function setParam(k, v) { S.p[k] = v; compute(); updateObs(); if (S.chapter === 3) markDone(3, knobWords()); }
function setNet(i) { S.netIndex = (i + NETS.length) % NETS.length; S.net = E.makeNet(NETS[S.netIndex]); S.sel = -1; S.rewired = true; compute(); updateObs(); updateChip(); }
function train(on) {
  S.trained = on; if (S.chapter === 2) S.trainedCh3 = on;
  compute(); renderStory(); layoutTracks();
  if (on) {
    fxStart("train"); S.playing = !reduceMotion || S.playing;
    if (S.chapter === 2 && D.fit) markDone(2, `读出误差 ${fmt(D.fit.rmse, 3)}，“原地不动”的猜法 ${fmt(D.fit.baseline, 3)}`);
  }
}
function select(i) {
  S.sel = i; if (i >= 0) { S.selSeen.add(i); if (S.chapter === 1) markDone(1, `查看了节点 ${i + 1} 的反应曲线和连线`); }
  dirty = staticDirty = true; updateObs(); updateChip();
}
function setInput(kind) {
  S.inputKind = S.freeInput = kind;
  if (kind === "draw" && !S.drawn) { S.drawn = new Float64Array(TW); for (let t = 0; t < TW; t++) S.drawn[t] = 0.5 * Math.sin(t / 11) * Math.cos(t / 37); }
  if (kind === "poke" && !S.pokes.length) S.pokes = [12];
  S.trained = kind !== "poke";
  compute(); renderStory(); layoutTracks(); markDone(4, `试了“${(INPUTS.find(q => q[0] === kind) || [])[1] || kind}”输入`);
}

/* ---------- rail ---------- */
function renderRail() {
  let html = CH.map((c, i) => `<button type="button" class="chap${S.done[i] ? " done" : ""}" data-go="${i}"${S.chapter === i ? ' aria-current="step"' : ""}><span class="num">${i + 1}</span>${c.name}</button>`).join("");
  if (S.run) html += `<button type="button" class="chap run" data-go="${RUN}"${S.chapter === RUN ? ' aria-current="step"' : ""}><span class="num">实</span>我的实验</button>`;
  html += `<span class="gap"></span>`;
  if (S.chapter < CH.length - 1) html += `<button type="button" class="tool next${S.done[S.chapter] ? " ready" : ""}" id="nextBtn" data-go="${S.chapter + 1}">下一步：${CH[S.chapter + 1].name}</button>`;
  else if (S.chapter === CH.length - 1 && S.embedded) html += `<button type="button" class="tool next ready" data-act="workbench">用真实数据训练一个</button>`;
  html += `<button type="button" class="tool" id="sciBtn" aria-pressed="${S.sci}">公式与注记</button>`;
  if (!S.embedded) html += `<button type="button" class="tool" id="themeBtn">${currentTheme() === "dark" ? "浅色" : "深色"}</button>`;
  $("rail").innerHTML = html;
}
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setTheme(t) { document.documentElement.dataset.theme = t === "dark" ? "dark" : "light"; readColors(); dirty = staticDirty = true; renderRail(); renderLegend(); drawMini(); }
$("rail").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go != null) goto(+b.dataset.go);
  else if (b.dataset.act === "workbench") host("workbench");
  else if (b.id === "sciBtn") { S.sci = !S.sci; $("app").classList.toggle("show-sci", S.sci); renderRail(); }
  else if (b.id === "themeBtn") setTheme(currentTheme() === "dark" ? "light" : "dark");
});

/* ---------- story ---------- */
const fmt = (v, d = 2) => (isFinite(v) ? v.toFixed(d) : "—");
function knobHTML(k, name, tech, lo, hi, step, left, right) {
  return `<div class="knob"><div class="row"><span class="name">${name}</span><span class="tech">${tech}</span><span class="val" id="val-${k}">${fmt(S.p[k])}</span></div>
    <div class="slide"><span>${left}</span><input type="range" data-knob="${k}" min="${lo}" max="${hi}" step="${step}" value="${S.p[k]}" aria-label="${name}（${tech}）"><span>${right}</span></div></div>`;
}
const knobsHTML = () =>
  knobHTML("rho", "回声长短", "谱半径 ρ", 0.1, 1.6, 0.01, "很快忘记", "停不下来") +
  knobHTML("leak", "反应快慢", "泄漏率 α", 0.05, 1, 0.01, "迟钝", "灵敏") +
  knobHTML("gain", "输入力度", "输入缩放", 0.1, 3, 0.05, "轻", "重");
const chipsHTML = (label, attr, items, cur) =>
  `<div class="chips"><span class="lbl">${label}</span>${items.map(([k, t]) => `<button type="button" class="chip" data-${attr}="${k}" aria-pressed="${cur(k)}">${t}</button>`).join("")}</div>`;
function navHTML() {            // shown on narrow screens only; wide screens use the button in the rail
  const i = S.chapter, last = i === CH.length - 1;
  return `<div class="nav">${i > 0 ? `<button type="button" class="btn ghost" data-go="${i - 1}">上一步</button>` : ""}
    ${last ? (S.embedded ? `<button type="button" class="btn ghost next ready" data-act="workbench">用真实数据训练一个</button>` : "")
           : `<button type="button" class="btn ghost next${S.done[i] ? " ready" : ""}" data-go="${i + 1}">下一步：${CH[i + 1].name}</button>`}</div>`;
}
function updateNav() { document.querySelectorAll(".next[data-go]").forEach(b => b.classList.toggle("ready", !!S.done[S.chapter])); }

function renderStory() {
  const k = isRun() ? "run" : CH[S.chapter].key;
  let h = "";
  if (k === "poke") h = `
    <h1>先敲一下</h1>
    <p class="lead">这一池光点就是储备池：${D.n} 个互相连着的节点。没有输入时它是静的。敲一下，看会发生什么。</p>
    <div class="acts"><button type="button" class="btn" data-act="poke">敲一下</button><span class="hint">也可以点下方“输入”那一行的任意位置</span></div>
    <div class="obs"><div class="echo"><div id="head"></div><canvas class="mini" id="mini"></canvas></div><div id="obs"></div></div>
    <div class="sci">状态更新：<code>x(t) = (1−α)·x(t−1) + α·tanh(W·x(t−1) + W_in·u(t) + b)</code>，与训练引擎相同。余波强度是“敲”与“不敲”两次运行的状态差 <code>‖Δx(t)‖/√N</code>，持续步数取它降到峰值 5% 以下的时刻。这只描述这一个网络和这一次输入，不能当作回声状态性质（ESP）的证明。</div>`;
  else if (k === "nodes") h = `
    <h1>同一下敲击，${D.n} 种反应</h1>
    <p class="lead">每个节点对同一次敲击的反应都不一样。下方“储备池”一行现在画的是 ${D.n} 条曲线，一个节点一条。点池子里任意一个节点，看它自己那条。</p>
    <div class="obs"><div id="obs"></div></div>
    <div class="acts"><button type="button" class="btn ghost" data-act="rewire">换一组随机连线</button></div>
    <div class="sci">节点摆在哪里只是排版，远近不代表连接强弱。选中节点后：蓝线是正权重，红线是负权重，粗细表示 <code>|W|</code>，箭头指向接收方。<code>W</code> 稀疏随机（约 10% 的位置有连接），按谱半径缩放后固定不变。</div>`;
  else if (k === "readout") h = `
    <h1>学习只发生在读出</h1>
    <p class="lead">换个任务：输入是一条波浪，要它提前 ${H} 步画出接下来的样子。储备池不改，只给每个节点配一个“音量”，把 ${D.n} 条曲线混成一条输出。这一步叫读出。</p>
    <div class="acts">${S.trained ? `<button type="button" class="btn" disabled>读出已训练</button><button type="button" class="btn ghost" data-act="untrain">撤销，再看一次</button>`
                                  : `<button type="button" class="btn" data-act="train">训练读出</button>`}</div>
    <div class="obs"><div id="obs"></div></div>
    <div class="sci"><code>ŷ(t+h) = b + w_u·u(t) + Σ wᵢ·xᵢ(t)</code>，岭回归 <code>λ = 1e-4</code>。时间轴前 70% 用来拟合（跳过开头 ${WASH} 步预热），后 30% 留出。对照是持续性基线 <code>ŷ(t+h) = u(t)</code>。读出线：蓝色是此刻的正向贡献 <code>wᵢ·xᵢ(t) &gt; 0</code>，红色是负向，粗细按本段最大值归一；两根柱子与下面一行数字用同一刻度，单位与输出相同。池子上方的黄线是不经过池子的输入直连项。这是示范任务，成绩不代表你的正式实验。</div>`;
  else if (k === "knobs") h = `
    <h1>三个旋钮，改池子的脾气</h1>
    <p class="lead">回到敲击。拖动旋钮，余波立刻跟着变；灰色虚线是改动前的样子。</p>
    <div class="obs top"><div class="echo"><div id="head"></div><canvas class="mini" id="mini"></canvas></div></div>
    ${knobsHTML()}
    ${chipsHTML("试试", "preset", [["forget", "健忘"], ["default", "默认"], ["slow", "慢性子"], ["wild", "停不下来"]], () => false)}
    <div id="obs"></div>
    <div class="sci"><code>ρ</code> 是循环矩阵 <code>W</code> 特征值的最大模；<code>α</code> 越小，状态每步更新得越少；输入缩放乘在 <code>W_in</code> 上。<code>ρ &lt; 1</code> 不是余波一定平息的保证，实际表现还取决于 α、输入和非线性。有限窗口里的观察不构成 ESP 证明。</div>`;
  else if (k === "free") h = `
    <h1>自由实验</h1>
    <p class="lead">都解锁了。换一种输入，或者自己画一条；调旋钮，看预测还跟不跟得上。</p>
    ${chipsHTML("输入", "input", INPUTS, v => v === S.inputKind)}
    <div class="obs top"><div class="echo"><div id="head"></div><canvas class="mini" id="mini"></canvas></div><div id="obs"></div></div>
    ${knobsHTML()}
    ${chipsHTML("显示", "show", [["inLines", "输入线"], ["edges", "内部连线"], ["readLines", "读出线"]], v => S.show[v])}
    ${chipsHTML("状态图", "mode", [["raster", "热图"], ["lines", "曲线"]], v => v === S.freeMode)}
    <div class="acts"><button type="button" class="btn ghost" data-act="rewire">换一组随机连线</button><button type="button" class="btn ghost" data-act="reset">恢复默认</button></div>
    <div class="sci">读出在每次改动后自动重新求解（前 70% 拟合、后 30% 留出，提前 ${H} 步）。非敲击输入下的“余波”是在第 80 步额外加一次敲击测得的，这次敲击不画在输入上。余波计时会在时间轴之外再多算 ${LONG} 步。示范网络与你的正式实验互不影响。</div>`;
  else h = runStoryHTML();
  $("story").innerHTML = `<div class="body">${h}</div>` + (k === "run" ? "" : navHTML());
  updateObs(); updateNav(); renderLegend();
}

function runStoryHTML() {
  const r = S.run, proj = r.project === "generic_esn" ? "通用 ESN" : "EBrush 运动预测";
  const readoutDescription = r.parts
    ? (r.parts.inferred ? "；多路输入没有随轨迹保存，直连项由‘预测 − 其余各项’得出"
      : `；这几项相加与保存的预测最大相差 ${r.parts.residual.toExponential(1)}（状态保存为 4 位小数）`)
    : "；旧版电子毛笔轨迹缺少录制边界，当前已禁用读出分解，需要用新版重新训练";
  return `
    <h1>你训练的模型</h1>
    <p class="lead">这是实验 ${esc(r.runId.slice(0, 12))} 保存下来的真实状态，和前面是同一种图：上面是池子，下面是时间。它是只读的，这里的操作不会改动它。</p>
    <dl class="facts"><dt>项目</dt><dd>${proj}</dd><dt>节点</dt><dd>${r.n} 个</dd><dt>输入</dt><dd>${r.inputs} 路</dd>
      <dt>预测</dt><dd>提前 ${r.horizon} 步</dd><dt>预热</dt><dd>${r.washout} 步不计分</dd></dl>
    ${chipsHTML("显示", "show", [...(r.win ? [["inLines", "输入线"]] : []), ["edges", "内部连线"], ["readLines", "读出线"]], v => S.show[v])}
    ${chipsHTML("状态图", "mode", [["raster", "热图"], ["lines", "曲线"]], v => v === S.freeMode)}
    <div class="obs"><div class="echo"><div id="head"></div><canvas class="mini" id="mini"></canvas></div><div id="obs"></div></div>
    <div class="sci">${r.uModel ? `“输入”一行和输入端口画的是模型实际收到的标准化输入 <code>(u − 训练均值) / 训练标准差</code>，中线就是训练均值；输入线的亮度是 <code>min(1, |W_in·u|)</code>。` : ""}内部连线亮度是 <code>min(1, 2.2·|W_ij·x_j(t)|)</code>，选中节点的线宽按 <code>|W_ij|</code>，都用模型自己的数值，没有按实验另行缩放。读出各项使用标准化目标单位${readoutDescription}。回声判定来自 ${r.echo && !r.echo.legacy ? r.echo.window : 96} 步的脉冲响应，有限窗口内的衰减不构成 ESP 证明。选中节点时显示的连线来自 <code>|W|</code> 最大的 ${r.edgeShown.toLocaleString()} / ${r.edgeTotal.toLocaleString()} 条；打开“内部连线”时最多画其中最强的 420 条。没画出的连接仍参与计算。${r.legacyUnbounded ? "旧版轨迹的预测暂不展示。" : "预测值画在同一录制里对应的目标时刻 <code>t+h</code>。"}回声来自对该模型做的一次标准化输入脉冲。${r.inputs > 1 ? "多路输入的原始向量没有随轨迹保存，“输入”一行是角速度幅值摘要，因此不画输入线。" : ""}</div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function echoLine(e) {
  if (!e || e.peak < 1e-9) return "";

let geo = null;

    c.strokeStyle = C.ink; c.lineWidth = 1; c.beginPath(); c.moveTo(x, a.y - 1); c.lineTo(x, b.y + b.h + 1); c.stroke();
    for (const row of TL.rows) if (row.k === "state") { c.strokeStyle = "rgba(255,255,255,.85)"; c.beginPath(); c.moveTo(x, row.y); c.lineTo(x, row.y + row.h); c.stroke(); }
  }

}
function hitTrack(e) {
  const r = $("tracks").getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const row = TL.rows.find(q => py >= q.y - 3 && py <= q.y + q.h + 3) || null;
  const ref = row || TL.rows[0];
  const t = ref ? Math.max(0, Math.min(D.T - 1, Math.round(((px - ref.x) / ref.w) * (D.T - 1)))) : 0;
  return { row, t, py };
}
let drag = null;
function sketch(e) {
  const { t, py } = hitTrack(e), row = TL.rows.find(q => q.k === "in");
  const v = Math.max(-1, Math.min(1, (row.y + row.h / 2 - py) / (row.h / 2 - 5)));
  const a = drag.last == null ? t : drag.last, lo = Math.min(a, t), hi = Math.max(a, t), va = drag.lastV == null ? v : drag.lastV;
  for (let k = lo; k <= hi; k++) S.drawn[k] = hi === lo ? v : (a < t ? va + (v - va) * (k - lo) / (hi - lo) : v + (va - v) * (k - lo) / (hi - lo));

}
$("tracks").addEventListener("pointerdown", e => {
  const { row, t } = hitTrack(e); if (!row) return;
  $("tracks").setPointerCapture(e.pointerId);
  if (row.k === "in" && !isRun() && S.inputKind === "poke") { poke(t); return; }
  if (row.k === "in" && !isRun() && S.inputKind === "draw") { drag = { kind: "draw" }; sketch(e); markDone(4, "手绘了一条输入"); return; }
  drag = { kind: "scrub" }; S.playing = false; S.pos = t; dirty = true; renderTransport();
});
$("tracks").addEventListener("pointermove", e => {
  const { row, t } = hitTrack(e);
  if (drag && drag.kind === "draw") return sketch(e);
  if (drag && drag.kind === "scrub") { S.pos = t; dirty = true; renderTransport(); return; }
  const canPoke = row && row.k === "in" && !isRun() && S.inputKind === "poke", nt = canPoke ? t : -1;
  if (nt !== hoverT) { hoverT = nt; dirty = true; }
  $("tracks").style.cursor = canPoke ? "pointer" : row && row.k === "in" && S.inputKind === "draw" && !isRun() ? "crosshair" : row ? "ew-resize" : "default";
});
const endDrag = () => { drag = null; };
$("tracks").addEventListener("pointerup", endDrag); $("tracks").addEventListener("pointercancel", endDrag);
$("tracks").addEventListener("pointerleave", () => { if (hoverT >= 0) { hoverT = -1; dirty = true; } });
$("tracks").addEventListener("keydown", e => {
  const stepBy = d => { S.playing = false; S.pos = Math.max(0, Math.min(D.T - 1, Math.round(S.pos) + d)); dirty = true; renderTransport(); e.preventDefault(); };
  if (e.key === "ArrowLeft") stepBy(e.shiftKey ? -10 : -1);
  else if (e.key === "ArrowRight") stepBy(e.shiftKey ? 10 : 1);
  else if (e.key === "Home") stepBy(-1e6);
  else if (e.key === "End") stepBy(1e6);
  else if (e.key === " ") { togglePlay(); e.preventDefault(); }
});

/* ---------- transport ---------- */
const ICON = { play: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z"/></svg>', pause: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 1.5h3.2v11H2.5zM8.3 1.5h3.2v11H8.3z"/></svg>' };
function togglePlay() { if (!S.playing && S.pos >= D.T - 1) S.pos = 0; S.playing = !S.playing; renderTransport(); dirty = true; }
let lastClock = "", lastPlay = null;
function renderTransport() {
  if (lastPlay !== S.playing) { $("play").innerHTML = S.playing ? ICON.pause : ICON.play; $("play").setAttribute("aria-label", S.playing ? "暂停" : "播放"); lastPlay = S.playing; }
  let seg = "";
  if (isRun() && D.split) seg = "（" + ((SEG.find(q => q[0] === segmentAt(S.pos)) || ["", ""])[1]) + "）";
  const i = Math.max(0, Math.min(D.T - 1, Math.round(S.pos)));
  const episodeText = isRun() && D.hasEpisodes ? ` · 录制片段 ${D.episodes[i] + 1} · 本段输入第 ${D.localSteps[i]} 步 → 目标第 ${D.localSteps[i] + D.horizon} 步` : "";
  const text = `第 ${D.tStart + i} 帧 / 共 ${isRun() ? D.total : D.T} 帧${seg}${episodeText}`;
  if (text !== lastClock) { $("clock").textContent = text; lastClock = text; }
  if (segmentAt(S.pos) !== shownSegment) renderSegments();          // button, label and playhead always agree
}
function renderSpeed() {
  $("speed").innerHTML = [0.5, 1, 2, 4].map(v => `<button type="button" data-speed="${v}" aria-pressed="${S.speed === v}">${v}×</button>`).join("");
}
const SEG = [["train", "训练段", 0], ["validation", "验证段", 1], ["test", "测试段", 2]];
const segmentAt = t => (isRun() && D.split ? (SEG[D.split[Math.max(0, Math.min(D.T - 1, Math.round(t)))]] || [null])[0] : null);
let shownSegment;

  if (!on) return;

    .map(([k, label]) => `<button type="button" data-segment="${k}" aria-pressed="${k === shownSegment}">${label}</button>`).join("");
}
$("play").addEventListener("click", togglePlay);
$("speed").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.speed = +b.dataset.speed; renderSpeed(); } });
$("segments").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !isRun()) return;
  const key = b.dataset.segment, first = D.split.indexOf(SEG.find(q => q[0] === key)[2]);
  if (first >= 0 && key !== segmentAt(S.pos)) { S.pos = first; S.playing = false; dirty = true; renderTransport(); }   // already loaded: just go there
  else host("segment", { key, runId: D.runId });                                                                      // otherwise ask the host for that window
});

/* ---------- loop ---------- */
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  if (S.playing && D) {
    const before = S.pos;
    S.pos += RATE * S.speed * dt;
    // Pause when entering a newly initialised episode, never animate across it.
    if (isRun() && D.episodeBoundaries) {
      for (let i = Math.floor(before) + 1; i <= Math.min(D.T - 1, Math.floor(S.pos)); i++) {
        if (D.episodeBoundaries[i]) { S.pos = i; S.playing = false;
          notice("新录制开始：储备池已重置，这里没有跨录制的递归传播"); break; }
      }
    }
    if (S.pos >= D.T - 1) { if (isRun()) { S.pos = D.T - 1; S.playing = false; } else S.pos = 0; }
    dirty = true; renderTransport();
  }

}
new ResizeObserver(() => { layoutTracks(); drawMini(); }).observe($("stage"));
window.addEventListener("resize", () => { layoutTracks(); drawMini(); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); dirty = staticDirty = true; renderRail(); renderLegend(); drawMini(); });

/* ---------- host API (Qt wrapper or tests) ---------- */
let toastTimer = 0;
function notice(text) {
  const el = $("toast"); el.textContent = String(text); el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 7000);
}
window.RCLab = {
  version: "0.7.2",
  setTheme,
  notice,
  setEmbedded(on) { S.embedded = !!on; renderRail(); renderStory(); renderSegments(); },
  loadRun(payload, opts) {
    S.run = buildRun(payload); renderRail();
    if ((opts && opts.focus) || S.chapter === RUN) { S.sel = -1; goto(RUN); }
    else notice(`实验 ${S.run.runId.slice(0, 12)} 已载入，点顶栏“我的实验”查看`);
  },
  loadFrames(frames) {

    if (S.chapter === RUN) { compute(); S.pos = 0; S.playing = false; layoutTracks(); renderTransport(); renderSegments(); updateObs(); }
  },
  go(i) { goto(i); },
  seek(t) { S.playing = false; S.pos = Math.max(0, Math.min(D.T - 1, t)); dirty = true; renderTransport(); },
  probe(t) {                      // read-only numbers at step t, for automated fidelity checks

    return { shown: D.u[i], model: D.uModel ? D.uModel[i] : null, segment: segmentAt(i),

  state() { return { chapter: S.chapter, done: S.done.slice(), pos: S.pos, playing: S.playing, pokes: S.pokes.slice(), sel: S.sel, trained: S.trained,
                     echo: D && D.echo ? { len: D.echo.len, settled: D.echo.settled, status: D.echo.status, window: D.echo.window } : null,

};

/* ---------- start ---------- */
const q = new URLSearchParams(location.search);
if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme") === "dark" ? "dark" : "light";
S.embedded = q.get("embedded") === "1";

requestAnimationFrame(frame);

})();
